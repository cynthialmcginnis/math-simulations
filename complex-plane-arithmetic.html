<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complex Plane Arithmetic Visualizer</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f4f6f8;
    padding: 24px;
    color: #1a1a1a;
  }
  .container {
    max-width: 880px;
    margin: 0 auto;
    background: white;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  h2 { margin-top: 0; color: #1a3c5e; }

  .level-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    border-bottom: 2px solid #EAF2F8;
  }
  .level-tab {
    background: none;
    border: none;
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 600;
    color: #6b7280;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
  }
  .level-tab.active { color: #1a3c5e; border-bottom-color: #1a6fa3; }
  .level-tab:hover { color: #1a6fa3; background: none; }
  @media (max-width: 600px) { body { padding: 8px; } .container { padding: 14px; } .level-tab { padding: 8px 10px; font-size: 14px; } .control-group { min-width: 140px; } }

  .controls {
    display: flex;
    gap: 24px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .control-group { flex: 1; min-width: 220px; }
  .control-group label {
    display: block;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .complex-input-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .complex-input-row span { font-weight: 600; color: #4a5a68; }
  input[type="number"] {
    width: 80px;
    padding: 8px 9px;
    font-size: 15px;
    border: 1px solid #c9d6e0;
    border-radius: 6px;
    box-sizing: border-box;
    font-family: inherit;
  }

  .btn-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 10px 0 18px;
    flex-wrap: wrap;
  }
  button {
    background: #1a6fa3;
    color: white;
    border: none;
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #14587f; }
  button:disabled { background: #a9c7d8; cursor: not-allowed; }
  button.secondary { background: #e5e7eb; color: #1a1a1a; }
  button.secondary:hover { background: #d1d5db; }

  .equation-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
  }
  .equation {
    font-size: 17px;
    font-weight: 600;
    background: #EAF2F8;
    color: #1a3c5e;
    padding: 10px 14px;
    border-radius: 8px;
    flex: 1;
    min-width: 260px;
  }
  .math-connection {
    font-size: 13px;
    background: #fff8e6;
    border: 1px solid #F0C040;
    color: #7a5c00;
    padding: 8px 12px;
    border-radius: 8px;
    flex: 1;
    min-width: 260px;
  }

  .canvas-wrap {
    background: #ffffff;
    border-radius: 8px;
    border: 1px solid #d0d7de;
    overflow: hidden;
    max-width: 620px;
    margin: 0 auto;
  }
  canvas {
    width: 100%;
    display: block;
    cursor: grab;
  }

  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    font-size: 13px;
    font-weight: 600;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>
<div class="container">
  <h2>Complex Plane Arithmetic Visualizer</h2>

  <div class="level-tabs">
    <button class="level-tab active" id="modeAddBtn" type="button">Addition</button>
    <button class="level-tab" id="modeMulBtn" type="button">Multiplication</button>
  </div>

  <div class="controls">
    <div class="control-group">
      <label style="color:#1a6fa3;">z&#8321; (blue): drag the point or type values</label>
      <div class="complex-input-row">
        <input type="number" id="z1re" value="4" step="0.5">
        <span>+</span>
        <input type="number" id="z1im" value="3" step="0.5">
        <span>i</span>
      </div>
    </div>
    <div class="control-group">
      <label style="color:#c0392b;">z&#8322; (red)</label>
      <div class="complex-input-row">
        <input type="number" id="z2re" value="-2" step="0.5">
        <span>+</span>
        <input type="number" id="z2im" value="5" step="0.5">
        <span>i</span>
      </div>
    </div>
  </div>

  <div class="btn-row">
    <button class="secondary" id="presetIBtn" type="button">z&#8322; = i</button>
    <button class="secondary" id="presetNeg1Btn" type="button">z&#8322; = &minus;1</button>
    <button class="secondary" id="presetConjBtn" type="button">z&#8322; = conjugate of z&#8321;</button>
    <button class="secondary" id="randomBtn" type="button">Randomize</button>
  </div>

  <div class="equation-row">
    <div class="equation" id="resultEq"></div>
    <div class="math-connection" id="detailPanel"></div>
  </div>

  <div class="canvas-wrap">
    <canvas id="canvas" width="680" height="680"></canvas>
  </div>

  <div class="legend">
    <span><span class="swatch" style="background:#1a6fa3;"></span> z&#8321;</span>
    <span><span class="swatch" style="background:#c0392b;"></span> z&#8322;</span>
    <span><span class="swatch" style="background:#16a34a;"></span> Result</span>
  </div>

  <div class="btn-row" id="animateRow" style="display:none;">
    <button id="animateBtn" type="button">Animate the Rotation</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const modeAddBtn = document.getElementById('modeAddBtn');
const modeMulBtn = document.getElementById('modeMulBtn');
const z1reInput = document.getElementById('z1re');
const z1imInput = document.getElementById('z1im');
const z2reInput = document.getElementById('z2re');
const z2imInput = document.getElementById('z2im');
const resultEq = document.getElementById('resultEq');
const detailPanel = document.getElementById('detailPanel');
const animateRow = document.getElementById('animateRow');
const animateBtn = document.getElementById('animateBtn');
const presetIBtn = document.getElementById('presetIBtn');
const presetNeg1Btn = document.getElementById('presetNeg1Btn');
const presetConjBtn = document.getElementById('presetConjBtn');
const randomBtn = document.getElementById('randomBtn');

const W = canvas.width, H = canvas.height;
function k() { return Math.max(1, (W / (canvas.clientWidth || W)) * 0.8); }
function font(weight, n) { return `${weight ? weight + ' ' : ''}${Math.round(n * k())}px sans-serif`; }
const MARGIN = { left: 50, right: 30, top: 30, bottom: 50 };
const plotW = W - MARGIN.left - MARGIN.right;
const plotH = H - MARGIN.top - MARGIN.bottom;
const centerXpx = MARGIN.left + plotW / 2;
const centerYpx = MARGIN.top + plotH / 2;

let mode = 'add';
let z1 = { re: 4, im: 3 };
let z2 = { re: -2, im: 5 };
let dragging = null;
let frozenView = null;
let animating = false;
let animId = null;

// ---------- Complex math ----------
function cAdd(p, q) { return { re: p.re + q.re, im: p.im + q.im }; }
function cMul(p, q) { return { re: p.re * q.re - p.im * q.im, im: p.re * q.im + p.im * q.re }; }
function magnitude(z) { return Math.sqrt(z.re * z.re + z.im * z.im); }
function angleDeg(z) { return Math.atan2(z.im, z.re) * 180 / Math.PI; }
function wrapAngle(deg) {
  let a = deg % 360;
  if (a > 180) a -= 360;
  if (a <= -180) a += 360;
  return a;
}

function niceStep(maxValue, targetTicks) {
  const rough = maxValue / targetTicks;
  const mag = Math.pow(10, Math.floor(Math.log10(rough || 1)));
  const norm = rough / mag;
  let step;
  if (norm < 1.5) step = 1;
  else if (norm < 3) step = 2;
  else if (norm < 7) step = 5;
  else step = 10;
  return step * mag;
}

function formatNum(n) {
  return Math.abs(n - Math.round(n)) < 0.01 ? Math.round(n).toString() : n.toFixed(1);
}

function formatComplex(z) {
  const rePart = formatNum(z.re);
  const imAbs = formatNum(Math.abs(z.im));
  return `${rePart} ${z.im < 0 ? '-' : '+'} ${imAbs}i`;
}

function joinTerms(terms) {
  return terms.map((t, i) => {
    const val = formatNum(Math.abs(t));
    if (i === 0) return (t < 0 ? '-' : '') + val;
    return (t < 0 ? ' - ' : ' + ') + val;
  }).join('');
}

// ---------- View (uniform scale so rotation looks correct) ----------
function computeView() {
  if (frozenView) { const result = mode === 'add' ? cAdd(z1, z2) : cMul(z1, z2); return { ...frozenView, result }; }
  const result = mode === 'add' ? cAdd(z1, z2) : cMul(z1, z2);
  const maxAbs = Math.max(2, Math.abs(z1.re), Math.abs(z1.im), Math.abs(z2.re), Math.abs(z2.im), Math.abs(result.re), Math.abs(result.im));
  const range = maxAbs * 1.35;
  const scale = Math.min(plotW, plotH) / (2 * range);
  const step = niceStep(range, 6);
  return { range, scale, step, result };
}

function pxX(re, view) { return centerXpx + re * view.scale; }
function pxY(im, view) { return centerYpx - im * view.scale; }

// ---------- Drawing ----------
function drawGrid(view) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fbfcfd';
  ctx.fillRect(0, 0, W, H);

  const start = -Math.floor(view.range / view.step) * view.step;
  for (let g = start; g <= view.range; g += view.step) {
    const isAxis = Math.abs(g) < 1e-6;
    const px = pxX(g, view);
    const py = pxY(g, view);

    ctx.strokeStyle = isAxis ? '#1a3c5e' : '#e2e8ef';
    ctx.lineWidth = isAxis ? 2 : 1;

    ctx.beginPath();
    ctx.moveTo(px, MARGIN.top);
    ctx.lineTo(px, H - MARGIN.bottom);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(MARGIN.left, py);
    ctx.lineTo(W - MARGIN.right, py);
    ctx.stroke();

    if (!isAxis) {
      ctx.fillStyle = '#8a97a3';
      ctx.font = font('', 10);
      ctx.textAlign = 'center';
      ctx.fillText(formatNum(g), px, centerYpx + 14 * k());
      ctx.textAlign = 'right';
      ctx.fillText(formatNum(g), centerXpx - 6, py + 3);
    }
  }

  ctx.strokeStyle = '#8a97a3';
  ctx.lineWidth = 1;
  ctx.strokeRect(MARGIN.left, MARGIN.top, plotW, plotH);

  ctx.fillStyle = '#1a3c5e';
  ctx.font = font('600', 13);
  ctx.textAlign = 'left';
  ctx.fillText('Re', W - MARGIN.right + 6, centerYpx + 4);
  ctx.fillText('Im', centerXpx + 6, MARGIN.top - 8);
}

function drawArrow(x1, y1, x2, y2, color, width) {
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = width || 2.5;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();

  const angle = Math.atan2(y2 - y1, x2 - x1);
  const headLen = 10 * k();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
  ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
  ctx.closePath();
  ctx.fill();
}

function drawPoint(view, z, color, label, dx, dy) {
  const px = pxX(z.re, view), py = pxY(z.im, view);
  ctx.beginPath();
  ctx.arc(px, py, 5 * k(), 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = color;
  ctx.font = font('600', 12);
  ctx.textAlign = (dx || 8) < 0 ? 'right' : 'left';
  ctx.fillText(label, px + (dx === undefined ? 8 : dx), py + (dy === undefined ? -8 : dy));
}

function drawMathAngleArc(view, radiusMathUnits, theta1Deg, theta2Deg, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  const steps = 40;
  for (let i = 0; i <= steps; i++) {
    const t = theta1Deg + (theta2Deg - theta1Deg) * (i / steps);
    const rad = (t * Math.PI) / 180;
    const re = radiusMathUnits * Math.cos(rad);
    const im = radiusMathUnits * Math.sin(rad);
    const px = pxX(re, view), py = pxY(im, view);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
}

function drawAdditionScene(view) {
  drawGrid(view);

  const sum = view.result;
  const p1 = { px: pxX(z1.re, view), py: pxY(z1.im, view) };
  const p2 = { px: pxX(z2.re, view), py: pxY(z2.im, view) };
  const ps = { px: pxX(sum.re, view), py: pxY(sum.im, view) };

  // parallelogram: translated copies (dashed)
  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = 'rgba(192,57,43,0.55)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(p1.px, p1.py); ctx.lineTo(ps.px, ps.py); ctx.stroke();
  ctx.strokeStyle = 'rgba(26,111,163,0.55)';
  ctx.beginPath(); ctx.moveTo(p2.px, p2.py); ctx.lineTo(ps.px, ps.py); ctx.stroke();
  ctx.setLineDash([]);

  drawArrow(centerXpx, centerYpx, p1.px, p1.py, '#1a6fa3', 3);
  drawArrow(centerXpx, centerYpx, p2.px, p2.py, '#c0392b', 3);
  drawArrow(centerXpx, centerYpx, ps.px, ps.py, '#16a34a', 3.5);

  drawPoint(view, z1, '#1a6fa3', `z1 = ${formatComplex(z1)}`);
  drawPoint(view, z2, '#c0392b', `z2 = ${formatComplex(z2)}`);
  drawPoint(view, sum, '#16a34a', `z1+z2 = ${formatComplex(sum)}`);
}

function drawMultiplicationScene(view, ghost) {
  drawGrid(view);

  const prod = view.result;
  const p1 = { px: pxX(z1.re, view), py: pxY(z1.im, view) };
  const p2 = { px: pxX(z2.re, view), py: pxY(z2.im, view) };
  const pp = { px: pxX(prod.re, view), py: pxY(prod.im, view) };

  const theta1 = angleDeg(z1);
  const theta2 = angleDeg(z2);
  const arcR1 = view.range * 0.14;
  const arcR2 = view.range * 0.24;

  drawMathAngleArc(view, arcR1, 0, theta1, 'rgba(26,111,163,0.6)');
  drawMathAngleArc(view, arcR2, theta1, theta1 + theta2, 'rgba(192,57,43,0.6)');

  drawArrow(centerXpx, centerYpx, p1.px, p1.py, '#1a6fa3', 3);
  drawArrow(centerXpx, centerYpx, p2.px, p2.py, '#c0392b', 3);
  drawArrow(centerXpx, centerYpx, pp.px, pp.py, '#16a34a', 3.5);

  drawPoint(view, z1, '#1a6fa3', `z1 = ${formatComplex(z1)}`);
  drawPoint(view, z2, '#c0392b', `z2 = ${formatComplex(z2)}`);
  drawPoint(view, prod, '#16a34a', `z1\u00b7z2 = ${formatComplex(prod)}`);

  if (ghost) {
    const gpx = pxX(ghost.re, view), gpy = pxY(ghost.im, view);
    drawArrow(centerXpx, centerYpx, gpx, gpy, '#F0C040', 4);
  }
}

function drawScene(ghost) {
  const view = computeView();
  if (mode === 'add') drawAdditionScene(view);
  else drawMultiplicationScene(view, ghost);
}

// ---------- Panels ----------
function updatePanels() {
  const view = computeView();
  if (mode === 'add') {
    const sum = view.result;
    resultEq.textContent = `z1 + z2 = (${formatNum(z1.re)} + ${formatNum(z1.im)}i) + (${formatNum(z2.re)} + ${formatNum(z2.im)}i) = ${formatComplex(sum)}`;
    detailPanel.innerHTML = `<strong>Add real parts, add imaginary parts.</strong> Geometrically this is the same as vector addition. Slide z2 to start at the tip of z1 (dashed lines show the parallelogram); the diagonal is the sum.`;
  } else {
    const prod = view.result;
    const ac = z1.re * z2.re, bd = z1.im * z2.im, ad = z1.re * z2.im, bc = z1.im * z2.re;
    const realBreakdown = joinTerms([ac, -bd]);
    const imagBreakdown = joinTerms([ad, bc]);
    resultEq.textContent = `(${formatComplex(z1)})(${formatComplex(z2)}) = (${realBreakdown}) + (${imagBreakdown})i = ${formatComplex(prod)}`;
    const r1 = magnitude(z1), r2 = magnitude(z2), rp = magnitude(prod);
    const t1 = wrapAngle(angleDeg(z1)), t2 = wrapAngle(angleDeg(z2)), tp = wrapAngle(angleDeg(prod));
    const tSum = wrapAngle(t1 + t2);
    detailPanel.innerHTML = `<strong>Geometric check:</strong> |z1|&middot;|z2| = ${formatNum(r1)}&times;${formatNum(r2)} = ${formatNum(r1 * r2)} = |z1&middot;z2| &nbsp;|&nbsp; ` +
      `&theta;1+&theta;2 = ${formatNum(t1)}&deg;+${formatNum(t2)}&deg; = ${formatNum(tSum)}&deg; &asymp; angle of product (${formatNum(tp)}&deg;). Multiplying rotates and scales.`;
  }
}

function refresh() {
  updatePanels();
  drawScene(null);
}

// ---------- Inputs ----------
function syncInputs() {
  z1reInput.value = z1.re;
  z1imInput.value = z1.im;
  z2reInput.value = z2.re;
  z2imInput.value = z2.im;
}

z1reInput.addEventListener('input', () => { z1.re = parseFloat(z1reInput.value) || 0; refresh(); });
z1imInput.addEventListener('input', () => { z1.im = parseFloat(z1imInput.value) || 0; refresh(); });
z2reInput.addEventListener('input', () => { z2.re = parseFloat(z2reInput.value) || 0; refresh(); });
z2imInput.addEventListener('input', () => { z2.im = parseFloat(z2imInput.value) || 0; refresh(); });

presetIBtn.addEventListener('click', () => { z2 = { re: 0, im: 1 }; syncInputs(); refresh(); });
presetNeg1Btn.addEventListener('click', () => { z2 = { re: -1, im: 0 }; syncInputs(); refresh(); });
presetConjBtn.addEventListener('click', () => { z2 = { re: z1.re, im: -z1.im }; syncInputs(); refresh(); });
randomBtn.addEventListener('click', () => {
  const rnd = () => Math.round((Math.random() * 12 - 6) * 2) / 2;
  z1 = { re: rnd(), im: rnd() };
  z2 = { re: rnd(), im: rnd() };
  syncInputs();
  refresh();
});

// ---------- Mode switching ----------
function setMode(m) {
  mode = m;
  modeAddBtn.classList.toggle('active', m === 'add');
  modeMulBtn.classList.toggle('active', m === 'mul');
  animateRow.style.display = m === 'mul' ? 'flex' : 'none';
  refresh();
}
modeAddBtn.addEventListener('click', () => setMode('add'));
modeMulBtn.addEventListener('click', () => setMode('mul'));

// ---------- Dragging ----------
function getCanvasPos(evt) {
  const rect = canvas.getBoundingClientRect();
  const scaleXCanvas = canvas.width / rect.width;
  const scaleYCanvas = canvas.height / rect.height;
  const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
  const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
  return {
    x: (clientX - rect.left) * scaleXCanvas,
    y: (clientY - rect.top) * scaleYCanvas
  };
}

function nearestPoint(pos, view) {
  const p1 = { x: pxX(z1.re, view), y: pxY(z1.im, view) };
  const p2 = { x: pxX(z2.re, view), y: pxY(z2.im, view) };
  const d1 = Math.hypot(pos.x - p1.x, pos.y - p1.y);
  const d2 = Math.hypot(pos.x - p2.x, pos.y - p2.y);
  const threshold = 18 * k();
  if (d1 < threshold && d1 <= d2) return 'z1';
  if (d2 < threshold) return 'z2';
  return null;
}

function startDrag(evt) {
  if (animating) return;
  const view = computeView();
  const pos = getCanvasPos(evt);
  dragging = nearestPoint(pos, view);
  if (dragging) { frozenView = view; evt.preventDefault(); }
}

function moveDrag(evt) {
  const view = computeView();
  const pos = getCanvasPos(evt);
  if (!dragging) {
    canvas.style.cursor = nearestPoint(pos, view) ? 'grab' : 'default';
    return;
  }
  evt.preventDefault();
  const re = Math.round(((pos.x - centerXpx) / view.scale) * 10) / 10;
  const im = Math.round(((centerYpx - pos.y) / view.scale) * 10) / 10;
  if (dragging === 'z1') z1 = { re, im }; else z2 = { re, im };
  syncInputs();
  refresh();
}

function endDrag() {
  if (dragging) { dragging = null; frozenView = null; refresh(); }
}

canvas.addEventListener('mousedown', startDrag);
canvas.addEventListener('mousemove', moveDrag);
window.addEventListener('mouseup', endDrag);
canvas.addEventListener('touchstart', startDrag, { passive: false });
canvas.addEventListener('touchmove', moveDrag, { passive: false });
window.addEventListener('touchend', endDrag);

// ---------- Animate multiplication ----------
animateBtn.addEventListener('click', () => {
  if (animating || mode !== 'mul') return;
  animating = true;
  animateBtn.disabled = true;

  const r1 = magnitude(z1);
  const theta1 = angleDeg(z1);
  const theta2 = angleDeg(z2);
  const rProd = r1 * magnitude(z2);
  const duration = 1400;
  const t0 = Date.now();

  function frame() {
    const elapsed = Date.now() - t0;
    const p = Math.min(1, elapsed / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    const curR = r1 + (rProd - r1) * eased;
    const curTheta = theta1 + theta2 * eased;
    const rad = (curTheta * Math.PI) / 180;
    const ghost = { re: curR * Math.cos(rad), im: curR * Math.sin(rad) };

    drawScene(ghost);

    if (p < 1) {
      animId = requestAnimationFrame(frame);
    } else {
      animating = false;
      animateBtn.disabled = false;
      drawScene(null);
    }
  }
  frame();
});

window.addEventListener('resize', () => { if (!animating) refresh(); });

// ---------- Init ----------
refresh();
</script>
</body>
</html>
